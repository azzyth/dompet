name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dompet
          POSTGRES_PASSWORD: dompet
          POSTGRES_DB: dompet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dompet -d dompet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dompet:dompet@localhost:5432/dompet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # streamlit is needed for the dashboard test below (which executes the app),
          # because /_stcore/health cannot tell a rendered dashboard from a crashed one.
          pip install -r requirements-dashboard.txt

      - name: Lint
        run: ruff check dompet tests scripts

      - name: Load schema, seed, views
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/views.sql

      - name: Load rule seeds and demo data (exercises scripts/ as documented)
        run: |
          python scripts/load_rules.py
          python scripts/seed_demo.py --n 50 --days 30

      - name: Tests (stdlib + DB-backed + dashboard AppTest)
        run: python -m unittest discover -s tests -v

      - name: Train categorizer (synthetic data, no secrets needed)
        run: python -m dompet.ml.train --config configs/train.yaml

      # --fail turns any 5xx into a non-zero exit, so a broken query fails the build.
      # /health alone was not enough: it never touches the transaction read paths.
      - name: API smoke test (all read endpoints + HTML landing page)
        run: |
          uvicorn dompet.api.main:app --port 8000 &
          sleep 3
          curl --fail http://localhost:8000/health
          curl --fail "http://localhost:8000/transactions?limit=5"
          curl --fail http://localhost:8000/summary
          curl --fail http://localhost:8000/forecast
          curl --fail http://localhost:8000/drift
          # Browsers get HTML; API clients keep getting JSON.
          curl --fail -H "Accept: text/html" http://localhost:8000/ | grep -qi "<!doctype html"
          curl --fail http://localhost:8000/ | grep -q '"service": *"dompet"'
